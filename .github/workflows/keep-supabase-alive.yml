name: Keep Supabase Awake

on:
  schedule:
    # รันทุกวันอาทิตย์และวันพุธ เวลา 00:00 UTC (กันเหนียว ยิง 2 ครั้งต่อสัปดาห์)
    - cron: '0 0 * * 0,3'
  workflow_dispatch: # ให้กดรันเองจากแท็บ Actions ได้ด้วย เผื่ออยากทดสอบ

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/budgets?select=category&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
